name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOMAIN: ${{ vars.DOMAIN }}
  API_DOMAIN: ${{ vars.API_DOMAIN }}
  NEXT_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_WS_URL || format('wss://{0}', vars.API_DOMAIN) }}

jobs:
  backend-checks:
    name: Backend — migrate and health
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shiftsync
          POSTGRES_PASSWORD: shiftsync
          POSTGRES_DB: shiftsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftsync -d shiftsync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://shiftsync:shiftsync@localhost:5432/shiftsync
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-minimum-32-characters-long
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate imports
        run: python -c "from app.main import app; print(app.title, '—', len(app.routes), 'routes')"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Start backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          echo "Backend PID: $!"

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/health | grep -q '"status"'; then
              echo "Ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/backend.log
          exit 1

  frontend-build:
    name: Frontend — build
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - name: Validate frontend build config
        run: |
          test -n "${API_DOMAIN}" || { echo "::error::Set API_DOMAIN in the production environment (e.g. softapi.serverops.co.ke)"; exit 1; }
          test -n "${NEXT_PUBLIC_WS_URL}" || { echo "::error::Set NEXT_PUBLIC_WS_URL or API_DOMAIN in the production environment"; exit 1; }
          echo "Using NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  publish-images:
    name: Publish images to GHCR
    runs-on: ubuntu-latest
    needs:
      - backend-checks
      - frontend-build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate image build config
        run: |
          test -n "${API_DOMAIN}" || { echo "::error::Set API_DOMAIN in the production environment (e.g. softapi.serverops.co.ke)"; exit 1; }
          test -n "${NEXT_PUBLIC_WS_URL}" || { echo "::error::Set NEXT_PUBLIC_WS_URL or API_DOMAIN in the production environment"; exit 1; }
          echo "Using NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}"

      - run: echo "GHCR_IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.GHCR_IMAGE_OWNER }}/soft-backend:${{ github.sha }}
            ghcr.io/${{ env.GHCR_IMAGE_OWNER }}/soft-backend:latest
          cache-from: type=gha,scope=soft-backend
          cache-to: type=gha,mode=max,scope=soft-backend

      - name: Publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: runner
          push: true
          build-args: |
            NEXT_PUBLIC_WS_URL=${{ env.NEXT_PUBLIC_WS_URL }}
          tags: |
            ghcr.io/${{ env.GHCR_IMAGE_OWNER }}/soft-frontend:${{ github.sha }}
            ghcr.io/${{ env.GHCR_IMAGE_OWNER }}/soft-frontend:latest
          cache-from: type=gha,scope=soft-frontend
          cache-to: type=gha,mode=max,scope=soft-frontend

  deploy-contabo:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [publish-images]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    environment: production
    env:
      CONTABO_HOST: ${{ secrets.CONTABO_HOST }}
      CONTABO_USER: ${{ secrets.CONTABO_USER }}
      CONTABO_SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
      CONTABO_SSH_PORT: ${{ secrets.CONTABO_SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      IMAGE_TAG: ${{ github.sha }}
      GHCR_IMAGE_OWNER: ${{ github.repository_owner }}
      SSL_CERT_DOMAINS: ${{ vars.SSL_CERT_DOMAINS }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_HOST_PORT: ${{ vars.POSTGRES_HOST_PORT }}
      REDIS_HOST_PORT: ${{ vars.REDIS_HOST_PORT }}
      BACKEND_HOST_PORT: ${{ vars.BACKEND_HOST_PORT }}
      FRONTEND_HOST_PORT: ${{ vars.FRONTEND_HOST_PORT }}
      GATEWAY_SITE_NAME: ${{ vars.GATEWAY_SITE_NAME }}
      SHARED_PROXY_NETWORK_NAME: ${{ vars.SHARED_PROXY_NETWORK_NAME }}
      RUN_SEED: ${{ vars.RUN_SEED }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
      GATEWAY_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          test -n "$CONTABO_HOST" || { echo "::error::CONTABO_HOST secret is required"; exit 1; }
          test -n "$CONTABO_USER" || { echo "::error::CONTABO_USER secret is required"; exit 1; }
          test -n "$CONTABO_SSH_KEY" || { echo "::error::CONTABO_SSH_KEY secret is required"; exit 1; }
          test -n "$DEPLOY_PATH" || { echo "::error::DEPLOY_PATH variable is required"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$CONTABO_SSH_KEY" > ~/.ssh/contabo_deploy_key
          chmod 600 ~/.ssh/contabo_deploy_key
          ssh-keyscan -p "$CONTABO_SSH_PORT" "$CONTABO_HOST" >> ~/.ssh/known_hosts
          {
            echo "RSYNC_SSH=ssh -i $HOME/.ssh/contabo_deploy_key -p $CONTABO_SSH_PORT -o ServerAliveInterval=15 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes -o StrictHostKeyChecking=accept-new"
            echo "SSH_OPTS=-i $HOME/.ssh/contabo_deploy_key -p $CONTABO_SSH_PORT -o ServerAliveInterval=15 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes -o StrictHostKeyChecking=accept-new"
          } >> "$GITHUB_ENV"

      - name: Create remote deploy directory
        run: |
          ssh $SSH_OPTS "$CONTABO_USER@$CONTABO_HOST" \
            "mkdir -p '$DEPLOY_PATH/deploy/scripts' '$DEPLOY_PATH/deploy/nginx' '$DEPLOY_PATH/deploy/sql' '$DEPLOY_PATH/backend'"

      - name: Sync source to Contabo
        run: |
          rsync -az --delete \
            -e "$RSYNC_SSH" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".DS_Store" \
            --exclude ".env" \
            --exclude "backend/.env" \
            --exclude "backend/.env.prod" \
            --exclude "frontend/.env" \
            --exclude "frontend/.env.local" \
            --exclude "frontend/node_modules/" \
            --exclude "frontend/.next/" \
            --exclude "backend/.venv/" \
            ./ "$CONTABO_USER@$CONTABO_HOST:$DEPLOY_PATH/"

      - name: Deploy on Contabo
        timeout-minutes: 45
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh $SSH_OPTS "$CONTABO_USER@$CONTABO_HOST" \
            "cd '$DEPLOY_PATH' && \
             IMAGE_TAG='$IMAGE_TAG' \
             GHCR_IMAGE_OWNER='${GHCR_IMAGE_OWNER,,}' \
             GHCR_USERNAME='$GHCR_USERNAME' \
             GHCR_TOKEN='$GHCR_TOKEN' \
             DOMAIN='$DOMAIN' \
             API_DOMAIN='$API_DOMAIN' \
             SSL_CERT_DOMAINS='$SSL_CERT_DOMAINS' \
             NEXT_PUBLIC_WS_URL='$NEXT_PUBLIC_WS_URL' \
             CORS_ORIGINS='$CORS_ORIGINS' \
             BACKEND_URL='$BACKEND_URL' \
             SECRET_KEY='$SECRET_KEY' \
             POSTGRES_USER='$POSTGRES_USER' \
             POSTGRES_PASSWORD='$POSTGRES_PASSWORD' \
             POSTGRES_DB='$POSTGRES_DB' \
             POSTGRES_HOST_PORT='$POSTGRES_HOST_PORT' \
             REDIS_HOST_PORT='$REDIS_HOST_PORT' \
             BACKEND_HOST_PORT='$BACKEND_HOST_PORT' \
             FRONTEND_HOST_PORT='$FRONTEND_HOST_PORT' \
             CERTBOT_EMAIL='$CERTBOT_EMAIL' \
             GATEWAY_ENABLED='$GATEWAY_ENABLED' \
             GATEWAY_SITE_NAME='$GATEWAY_SITE_NAME' \
             SHARED_PROXY_NETWORK_NAME='$SHARED_PROXY_NETWORK_NAME' \
             RUN_SEED='$RUN_SEED' \
             bash deploy/scripts/deploy-contabo.sh"
