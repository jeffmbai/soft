# Production stack on shared Contabo VPS — routes via serverops-gateway.
# Run: docker compose -f docker-compose.prod.yml --profile all up -d

x-serverops-labels: &serverops-labels
  serverops.enabled: "true"
  serverops.project.name: "ShiftSync"
  serverops.project.slug: "soft"
  serverops.project.folder: "/opt/soft"
  serverops.project.compose: "docker-compose.prod.yml"
  serverops.project.profiles: "all"
  serverops.project.url: "https://${DOMAIN}"
  serverops.project.repo: "jeffmbai/soft"
  serverops.health.url: "https://${API_DOMAIN}/health"
  serverops.ssl.domains: "${SSL_CERT_DOMAINS}"
  serverops.commands.ssl: "./deploy/scripts/renew-ssl.sh"
  serverops.gateway.site_name: "${GATEWAY_SITE_NAME:-soft}"
  serverops.database.container: "soft-postgres"
  serverops.database.name: "${POSTGRES_DB}"
  serverops.database.user: "${POSTGRES_USER}"

services:
  postgres:
    image: postgres:16-alpine
    container_name: soft-postgres
    restart: unless-stopped
    labels:
      <<: *serverops-labels
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: soft-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT}:6379"

  backend:
    image: ghcr.io/${GHCR_IMAGE_OWNER}/soft-backend:${IMAGE_TAG}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soft-backend
    restart: unless-stopped
    labels:
      <<: *serverops-labels
    env_file:
      - ./backend/.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${BACKEND_HOST_PORT}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s
    networks:
      - default
      - serverops_proxy

  frontend:
    profiles: ["all"]
    image: ghcr.io/${GHCR_IMAGE_OWNER}/soft-frontend:${IMAGE_TAG}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    container_name: soft-frontend
    restart: unless-stopped
    labels:
      <<: *serverops-labels
    environment:
      BACKEND_URL: ${BACKEND_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_HOST_PORT}:3000"
    networks:
      - default
      - serverops_proxy

volumes:
  postgres_data:

networks:
  serverops_proxy:
    name: ${SHARED_PROXY_NETWORK_NAME}
    external: true
